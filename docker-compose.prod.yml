services:
  # ========================
  # Application Services
  # ========================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adsight-api
    expose:
      - "8000"
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adsight-celery-worker
    env_file: .env.production
    depends_on:
      - api
    command: celery -A app.celery_app worker -l info -c 1
    deploy:
      resources:
        limits:
          memory: 200M
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adsight-celery-beat
    env_file: .env.production
    depends_on:
      - api
    command: celery -A app.celery_app beat -l info
    deploy:
      resources:
        limits:
          memory: 100M
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ""
    container_name: adsight-frontend
    expose:
      - "80"
    restart: unless-stopped

  # ========================
  # Reverse Proxy
  # ========================
  nginx:
    image: nginx:alpine
    container_name: adsight-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

  # ========================
  # Infrastructure Services
  # ========================
  postgres:
    image: postgres:16-alpine
    container_name: adsight-postgres
    env_file: .env.production
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres -c shared_buffers=128MB -c work_mem=4MB -c effective_cache_size=256MB
    deploy:
      resources:
        limits:
          memory: 300M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adsight"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  elasticsearch:
    build:
      context: ./elasticsearch
      dockerfile: Dockerfile
    container_name: adsight-elasticsearch
    expose:
      - "9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms200m -Xmx200m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./elasticsearch/config:/usr/share/elasticsearch/config/custom
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 350M
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: adsight-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 50mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: adsight-minio
    env_file: .env.production
    expose:
      - "9000"
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

volumes:
  postgres_data:
  es_data:
  redis_data:
  minio_data:
