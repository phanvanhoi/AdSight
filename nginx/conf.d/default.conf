upstream api_backend {
    server api:8000;
}

upstream frontend_app {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'self';" always;

    # --- Common proxy headers ---
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Auth endpoints (strict rate limit) ---
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://api_backend;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # --- API endpoints ---
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://api_backend;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # --- Health check (no rate limit) ---
    location /health {
        proxy_pass http://api_backend;
    }

    # --- API docs ---
    location /docs {
        proxy_pass http://api_backend;
    }

    location /openapi.json {
        proxy_pass http://api_backend;
    }

    location /redoc {
        proxy_pass http://api_backend;
    }

    # --- Static files (long cache) ---
    location /assets/ {
        proxy_pass http://frontend_app;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- Frontend (everything else) ---
    location / {
        proxy_pass http://frontend_app;

        # WebSocket support (Vite HMR in dev)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
